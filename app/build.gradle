plugins {
    id 'com.android.application'
}

android {
    namespace 'id.denpam.app'
    compileSdk 35

    defaultConfig {
        applicationId 'id.denpam.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Tanpa dependensi AndroidX: aplikasi menggunakan API Android standar.
